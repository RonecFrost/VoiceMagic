name: Build VoiceMagic NeoForge JAR
on:
  push:
    branches: [main, voice-riff-v0.5]
  workflow_dispatch:
concurrency:
  group: voicemagic-${{ github.ref }}-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile NeoForge addon
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMagic-ArsNouveau-NeoForge-1.21.1-JAR
          path: build/libs/voicemagic-*.jar
          if-no-files-found: error
