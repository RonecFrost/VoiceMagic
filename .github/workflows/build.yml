name: Build VoiceMagic NeoForge JAR
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the source project from archive
        run: |
          cat bootstrap/source.001 bootstrap/source.00{5,6,7,8,9} bootstrap/source.01{0,1,2,3,4} > /tmp/voicemagic.b64
          base64 --decode /tmp/voicemagic.b64 > /tmp/voicemagic.tar.br
          echo '9942bfb95419ca2bc7232f0498106aa74870982479f1520f538d6d2615946713  /tmp/voicemagic.tar.br' | sha256sum --check
          python -m pip install --quiet brotli
          python - <<'PY'
          import brotli, tarfile, io, pathlib
          archive = pathlib.Path('/tmp/voicemagic.tar.br').read_bytes()
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(archive)),mode='r:') as tf:
              tf.extractall('.', filter='data')
          PY
      - name: Make source files visible in the repository
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle settings.gradle gradle.properties src
          if ! git diff --cached --quiet; then
            git commit -m 'Expand VoiceMagic v0.2 project source files'
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile NeoForge mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Publish downloadable compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMagic-v0.2.0-NeoForge-1.21.1-JAR
          path: build/libs/voicemagic-0.2.0.jar
          if-no-files-found: error
