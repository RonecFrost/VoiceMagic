plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version=mod_version
group=mod_group_id
base { archivesName=mod_id }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge {
    version=neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories {
    mavenCentral()
    maven { name='OctoStudios'; url='https://maven.octo-studios.com/releases' }
    maven { name='GeckoLib'; url='https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name='Illusive'; url='https://maven.theillusivec4.top/' }
    maven { name='BlameJared'; url='https://maven.blamejared.com/' }
    maven { name='Forge'; url='https://maven.minecraftforge.net' }
    maven { url='https://jitpack.io' }
}
dependencies {
    implementation "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}"
    compileOnly "com.hollingsworth.nuggets:nuggets-neoforge-1.21:1.0.7.38"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.6.6"
    compileOnly "vazkii.patchouli:Patchouli:1.21-87-NEOFORGE-SNAPSHOT"
    compileOnly 'com.github.glitchfiend:TerraBlender-neoforge:1.21-4.0.0.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
