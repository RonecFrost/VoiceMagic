plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version=mod_version
group=mod_group_id
base { archivesName=mod_id }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge {
    version=neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url "https://cursemaven.com" } }
        filter { includeGroup "curse.maven" }
    }
    maven { name='BlameJared'; url='https://maven.blamejared.com/' }
    maven { name='GeckoLib'; url='https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    // Exactly the current 1.21.1 NeoForge release of Ars Nouveau on CurseForge.
    implementation "curse.maven:ars-nouveau-401955:9521184"
    compileOnly "com.hollingsworth.nuggets:nuggets-neoforge-1.21:1.0.11.42"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.6.6"
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
